name: FlashcardMVP
options:
  bundleIdPrefix: com.pathvana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 7WL9KY32LF
    CODE_SIGN_STYLE: Automatic
targets:
  FlashcardMVP:
    type: application
    platform: iOS
    sources:
      - FlashcardMVP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathvana.flashcard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: Flashcard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Flashcard uses the camera to photograph study material and turn it into flashcards."
        NSPhotoLibraryUsageDescription: "Flashcard uses your photo library to import study material images."
  FlashcardMVPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlashcardMVPTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: FlashcardMVP
  FlashcardMVPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FlashcardMVPUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: FlashcardMVP
schemes:
  FlashcardMVP:
    build:
      targets:
        FlashcardMVP: all
        FlashcardMVPTests: [test]
        FlashcardMVPUITests: [test]
    test:
      targets:
        - FlashcardMVPTests
  DemoCapture:
    build:
      targets:
        FlashcardMVPUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlashcardMVPUITests
